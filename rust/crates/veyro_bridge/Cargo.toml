[package]
name = "veyro_bridge"
description = "FFI bridge between the Flutter UI and the VEYRO Rust core (the only crate that may contain generated unsafe glue)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# cdylib: loaded by the Flutter app (Windows: veyro_bridge.dll, Android: libveyro_bridge.so).
# rlib: lets integration tests link against this crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
flutter_rust_bridge = "=2.13.0"
# BIP39 English wordlist for the seed-input suggestions (import screen).
bip39 = { workspace = true }

crypto_vault = { path = "../crypto_vault" }
key_manager = { path = "../key_manager" }
wallet_core = { path = "../wallet_core" }
storage = { path = "../storage" }
backup_manager = { path = "../backup_manager" }
chains = { path = "../chains" }
zeroize = { workspace = true }
hex = { workspace = true }
# Txid parsing for status lookups (same version as the chains crate pins).
bitcoin = "0.32"
